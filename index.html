
<!DOCTYPE html>
<html lang="it" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OmniCalc Engineering Suite</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- External Libs for Structural Load -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <!-- Tailwind Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'] 
                    },
                    colors: {
                        orange: {
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        },
                        app: {
                            bg: '#111827',
                            panel: '#0a0f1d',
                            input: '#070b14',
                            border: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #111827;
            color: #e2e8f0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem; 
        }

        :root { --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px); }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .industrial-label {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #6b7280;
            margin-bottom: 0.3rem;
            display: block;
        }

        .glass-card, .glass-panel {
            background: rgba(31, 41, 55, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(75, 85, 99, 0.15);
        }
        
        .glass-input {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(4px);
        }
        .glass-input:focus {
            outline: none;
            border-color: rgba(249, 115, 22, 0.5);
            background: rgba(17, 24, 39, 0.9);
        }

        .industrial-input {
            background: #070b14;
            border: 1px solid #1f2937;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .industrial-input:focus {
            border-color: #ea580c;
            outline: none;
            box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.1);
        }

        .dock-container { padding-bottom: calc(1rem + var(--safe-area-inset-bottom)); }

        @media print {
            @page { margin: 1cm; size: A4; }
            body, html, #root, main, section {
                height: auto !important; overflow: visible !important; position: relative !important;
                display: block !important; background-color: white !important; color: black !important;
            }
            .no-print, aside, header, .fixed, footer { display: none !important; }
            .print-only { display: block !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .bg-app-bg, .bg-app-panel, .glass-card, .glass-panel, .bg-black\/20, .bg-black\/30, .bg-black\/40, .bg-gray-900, .bg-gray-800 {
                background: white !important; border: 1px solid #ddd !important; box-shadow: none !important; backdrop-filter: none !important; color: black !important;
            }
            .text-white, .text-slate-200, .text-slate-300, .text-gray-200, .text-gray-300 { color: #000 !important; }
            .text-slate-400, .text-slate-500, .text-gray-400, .text-gray-500 { color: #444 !important; }
            .text-orange-400, .text-orange-500 { color: #c2410c !important; }
            .border-white\/5, .border-white\/10, .border-app-border, .border-gray-700, .border-gray-600 { border-color: #ccc !important; }
            input, select, textarea { background: transparent !important; border: 1px solid #ddd !important; color: black !important; box-shadow: none !important; }
            .print-break-inside, .break-inside-avoid { break-inside: avoid; }
            .page-break { page-break-before: always; }
            svg text { fill: #000 !important; }
            .industrial-label { color: #333 !important; }
        }
        .print-only { display: none; }
        .pdf-exporting .no-print { display: none !important; }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </head>
  <body class="antialiased selection:bg-orange-600/30">
    <div id="root"></div>
  </body>
</html>
