
<!DOCTYPE html>
<html lang="it" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OmniCalc Engineering Suite</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'] 
                    },
                    colors: {
                        orange: {
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        },
                        app: {
                            bg: '#111827',
                            panel: '#0a0f1d',
                            input: '#070b14',
                            border: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #111827;
            color: #e2e8f0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem; /* Aumentato a ~15px */
        }

        /* Industrial Scrollbar - Più sottile */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }

        .industrial-label {
            font-size: 10px; /* Aumentato da 8px */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #6b7280;
            margin-bottom: 0.4rem;
            display: block;
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(75, 85, 99, 0.15);
        }
        
        /* Aggiunta definizione glass-input per compatibilità */
        .glass-input {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(4px);
        }
        .glass-input:focus {
            outline: none;
            border-color: rgba(249, 115, 22, 0.5);
            background: rgba(17, 24, 39, 0.9);
        }

        .industrial-input {
            background: #070b14;
            border: 1px solid #1f2937;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
            font-size: 0.9rem; /* Aumentato default input */
        }

        .industrial-input:focus {
            border-color: #ea580c;
            outline: none;
            box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.1);
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .glass-card { border: 1px solid #ddd !important; background: none !important; backdrop-filter: none !important; }
            .industrial-label { color: #666 !important; }
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./index.tsx"></script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
</head>
  <body class="antialiased selection:bg-orange-600/30">
    <div id="root"></div>
  </body>
</html>
