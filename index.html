<!DOCTYPE html>
<html lang="it" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ThermoCalc Suite (Web Version)</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        accent: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body {
            /* Sfondo profondo con gradienti per esaltare il glassmorphism */
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
        }

        /* Classe Utility Glassmorphism */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            color: white;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(59, 130, 246, 0.5);
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }

        /* Scrollbar personalizzata */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        /* Utility per nascondere scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* STILI DI STAMPA PROFESSIONALE */
        @media print {
            @page {
                size: A4;
                margin: 1cm;
            }
            
            html, body {
                background: white !important;
                color: #1a1a1a !important;
                background-image: none !important;
                font-family: 'Inter', sans-serif !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }

            /* Reset Glassmorphism for Print readability */
            .glass-panel, .glass-input {
                background: white !important;
                backdrop-filter: none !important;
                box-shadow: none !important;
                border: 1px solid #e5e7eb !important;
                color: #1a1a1a !important;
                border-radius: 8px !important;
            }

            .glass-input {
                border-bottom: 1px solid #ccc !important;
                padding-left: 0 !important;
                background: transparent !important;
            }

            /* Layout adjustments */
            .print-break-inside {
                break-inside: avoid;
                page-break-inside: avoid;
                margin-bottom: 20px;
                display: block !important;
                overflow: visible !important;
            }
            
            .print-full-width {
                width: 100% !important;
                max-width: none !important;
                display: block !important;
            }

            /* Reset Overflows specifically for print */
            .overflow-hidden, .overflow-auto, .overflow-x-auto, .overflow-y-auto {
                overflow: visible !important;
                height: auto !important;
            }

            /* Reset Flexbox structure that might clip content */
            #root, main, .flex-col, .min-h-screen {
                display: block !important;
                min-height: 0 !important;
                height: auto !important;
            }

            /* Colori testi per risparmio inchiostro ma leggibilità */
            .text-white, .text-slate-200, .text-slate-300 { color: #000 !important; }
            .text-slate-400, .text-slate-500 { color: #4b5563 !important; }
            .text-accent-400, .text-accent-500, .text-emerald-400, .text-orange-400 { color: #000 !important; font-weight: bold !important; }
            
            /* Nascondi elementi UI non necessari */
            .no-print, header, footer, button, nav, .toast-container, .input-group-ui, .fa-solid, .fa-regular {
                display: none !important;
            }

            /* Specific fix for Maps if they are Canvas based */
            .leaflet-container {
                width: 100% !important;
                height: 400px !important;
                display: block !important;
                border: 1px solid #ccc;
            }

            /* Header di stampa */
            body::before {
                content: "ThermoCalc Suite Professional Report";
                display: block;
                text-align: center;
                font-size: 18pt;
                font-weight: bold;
                margin-bottom: 20px;
                border-bottom: 2px solid #333;
                padding-bottom: 10px;
            }
            
            body::after {
                content: "Generato da ThermoCalc Suite Web";
                display: block;
                text-align: center;
                font-size: 8pt;
                color: #666;
                margin-top: 20px;
                border-top: 1px solid #ccc;
                padding-top: 10px;
            }
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "vite": "https://aistudiocdn.com/vite@^7.2.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script type="module" src="./index.tsx"></script>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-accent-500/30">
    <div id="root"></div>
</body>
</html>
