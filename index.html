    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        accent: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body {
            /* Sfondo profondo con gradienti per esaltare il glassmorphism */
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
        }

        /* Classe Utility Glassmorphism */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            color: white;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(59, 130, 246, 0.5);
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }

        /* Scrollbar personalizzata */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        /* Utility per nascondere scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Utility per stampa */
        .print-only { display: none !important; }

        /* STILI DI STAMPA PROFESSIONALE */
        @media print {
            @page {
                size: A4;
                margin: 0.8cm;
            }
            
            .print-only { display: block !important; }
            .no-print { display: none !important; }

            html, body {
                background: white !important;
                background-image: none !important;
                color: #000 !important;
                font-family: 'Inter', sans-serif !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                font-size: 11pt;
                width: 100%;
                margin: 0;
                padding: 0;
            }

            /* Trasforma i pannelli glass in box puliti */
            .glass-panel {
                background: white !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                border-radius: 4px !important;
                margin-bottom: 20px !important;
                backdrop-filter: none !important;
                color: #000 !important;
                break-inside: avoid;
            }

            /* Trasforma gli input in testo leggibile */
            .glass-input, input, select, textarea {
                background: transparent !important;
                border: none !important;
                border-bottom: 1px solid #ddd !important;
                color: #000 !important;
                border-radius: 0 !important;
                padding-left: 0 !important;
                box-shadow: none !important;
                font-weight: bold;
            }

            /* Gestione colori testi per la stampa */
            .text-white { color: #000 !important; }
            .text-slate-300, .text-slate-400, .text-slate-500 { color: #444 !important; }
            
            /* Mantieni i colori semantici ma rendili stampabili */
            .text-accent-400, .text-accent-500, .text-blue-400 { color: #2563eb !important; } /* Blue */
            .text-emerald-400, .text-emerald-500 { color: #059669 !important; } /* Green */
            .text-red-400, .text-red-500 { color: #dc2626 !important; } /* Red */
            .text-orange-400, .text-orange-500 { color: #d97706 !important; } /* Orange */

            /* Gestione Layout Stampa */
            #root, main, .min-h-screen {
                display: block !important;
                height: auto !important;
                min-height: 0 !important;
            }

            /* Forza la larghezza per evitare tagli */
            .container, .max-w-7xl, .w-\[95\%\] {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* Gestione Interruzioni Pagina */
            h1, h2, h3 { 
                page-break-after: avoid; 
                break-after: avoid;
                color: #000 !important;
                border-bottom: 1px solid #000;
                padding-bottom: 5px;
            }
            
            .print-break-inside {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* Specifiche per Mappe */
            .leaflet-container {
                border: 1px solid #000;
                height: 350px !important;
            }
            
            /* Nascondi icone puramente decorative se danno fastidio, o falle nere */
            i.fa-solid, i.fa-regular {
                color: #444 !important;
            }

            /* Assicura che i grafici a barre colorate si vedano */
            .bg-emerald-500, .bg-blue-500, .bg-orange-500, .bg-red-500 {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
